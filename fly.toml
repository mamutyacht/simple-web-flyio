# fly.toml app configuration file generated for simple-web-flyio on 2026-10-02T03:17:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'simple-web-flyio'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
